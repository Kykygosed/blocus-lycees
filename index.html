<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lycéens en lutte</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#2338ff;--ink:#0d0d1a;--hot:#ff4a1c;--bg:#f7f7f5;--mut:#5c5f7a}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 "DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1;letter-spacing:.01em}
input,select,textarea,button{font:inherit;padding:10px 12px;border:3px solid var(--ink);border-radius:0;background:#fff;color:var(--ink)}
button{background:var(--ink);color:#fff;cursor:pointer;font-weight:600;transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--hot)}
button.g{background:var(--hot);border-color:var(--ink)}button.d{background:var(--hot)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:.92rem}
.logo{width:48px;height:48px;object-fit:contain}.ph{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.ph img{width:66px;height:66px;object-fit:cover;cursor:zoom-in;border:2px solid var(--ink)}
header{background:var(--blue);color:#fff;padding:60px 20px 72px}.w{max-width:960px;margin:auto}
h1{font-size:clamp(3.2rem,14vw,9rem);margin:0;text-transform:uppercase;line-height:.9}
header p{max-width:520px;font-size:1.2rem;margin:24px 0 0}
.tag{display:inline-block;background:var(--hot);color:#fff;padding:8px 16px;font:1.4rem Anton,Impact,sans-serif;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--ink);margin-top:28px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--ink);display:flex;gap:26px;padding:12px 20px;overflow-x:auto;justify-content:center}nav a{color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}nav a:hover{color:var(--blue)}
main{max-width:960px;margin:auto;padding:0 20px 70px}section{padding-top:56px}
h2{font-size:clamp(2.2rem,6vw,3.4rem);margin:0 0 24px}h2::after{content:"";display:block;width:70px;height:8px;background:var(--hot);margin-top:12px}
.rs{display:flex;gap:20px;align-items:flex-start;padding:22px 0;border-top:3px solid var(--ink)}.rs:last-child{border-bottom:3px solid var(--ink)}
.big{font-size:2.8rem;line-height:1}.rs h3{font-size:1.9rem;margin:0 0 6px}.rs p{margin:0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:#fff;border:3px solid var(--ink);padding:16px;box-shadow:6px 6px 0 var(--ink)}.card b{font-size:1.1rem}
#q{width:100%;margin-bottom:24px;font-size:1.1rem}h3.s{font-size:1.6rem;margin:40px 0 14px}
form>*{margin:0 8px 10px 0}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}#lb img{max-width:94%;max-height:94%}
@media(max-width:520px){.rs{flex-direction:column;gap:8px}}
</style></head><body>
<header><div class="w"><h1 id="t">Lycéens en lutte</h1><p id="st"></p><div class="tag"><span id="cnt2">0</span> lycées mobilisés</div></div></header>
<nav><a href="#raisons">Nos raisons</a><a href="#lycees">Lycées mobilisés</a></nav>
<main>
<section id="raisons"><h2>Pourquoi on manifeste</h2><div id="reasons"></div></section>
<section id="lycees"><h2>Lycées mobilisés (<span id="cnt">0</span>)</h2>
<input id="q" placeholder="Chercher un lycée ou une ville…" aria-label="Rechercher un lycée">
<div class="grid" id="list"></div>
<h3 class="s">Ton lycée n'est pas dans la liste ?</h3>
<form id="rf"><input id="rn" placeholder="Nom du lycée" required><input id="rc" placeholder="Ville"><input id="rp" placeholder="Ton pseudo" maxlength="20"><button>Demander l'ajout</button></form><p class="mut" id="rok"></p></section>
</main>
<input type="file" id="f" accept="image/*" hidden><div id="lb" onclick="this.style.display='none'"><img id="lbi"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBPq6Wfxzq02MfK69BFxHm9_FUjDGTmAcw",authDomain:"kykychat-24c7f.firebaseapp.com",databaseURL:"https://kykychat-24c7f-default-rtdb.firebaseio.com",projectId:"kykychat-24c7f",storageBucket:"kykychat-24c7f.firebasestorage.app",messagingSenderId:"342562811927",appId:"1:342562811927:web:0fed1e1f511c4fddcfec52"});
const db=firebase.database(),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=p=>/^data:image\/[a-z+]+;base64,[A-Za-z0-9+\/=]+$/.test(p||'')?p:'';
const DEF={title:"Lycéens en lutte",subtitle:"Ici, on rassemble nos raisons de manifester et les lycées mobilisés.",reasons:[
{icon:"⏰",title:"Des horaires trop longs",text:"8h–17h depuis des années : c'est trop pour apprendre correctement."},
{icon:"👥",title:"Des classes surchargées",text:"35 élèves par classe, voire plus. Impossible d'être suivi."},
{icon:"📉",title:"Manque de moyens et de profs",text:"Des postes non pourvus, des cours non remplacés, du matériel manquant."}]};
function img(file,max=800,type='image/jpeg'){return new Promise(r=>{const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(type,.7))};i.src=f.result};f.readAsDataURL(file)})}
window.zoom=s=>{$('#lbi').src=s;$('#lb').style.display='grid'};
let schools={},target=null;

db.ref('content').on('value',s=>{const c=s.val()||DEF;$('#t').textContent=c.title||DEF.title;$('#st').textContent=c.subtitle||'';document.title=c.title||DEF.title;
$('#reasons').innerHTML=Object.values(c.reasons||[]).map(r=>`<div class="rs"><span class="big">${esc(r.icon)}</span><div><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p></div></div>`).join('')});

db.ref('schools').on('value',s=>{schools=s.val()||{};rs()});

function rs(){const q=$('#q').value.toLowerCase(),l=Object.entries(schools).filter(([,s])=>s.affected&&(s.name+' '+(s.city||'')).toLowerCase().includes(q));
$('#cnt').textContent=l.length;$('#cnt2').textContent=Object.values(schools).filter(x=>x.affected).length;
$('#list').innerHTML=l.map(([id,s])=>`<div class="card"><div class="row">${ok(s.logo)?`<img class="logo" src="${ok(s.logo)}" alt="">`:''}<div><b>${esc(s.name)}</b><br><span class="mut">${esc(s.city)}</span></div></div>
<div class="ph">${Object.values(s.photos||{}).map(p=>ok(p)?`<img src="${ok(p)}" onclick="zoom(this.src)" alt="Photo de la mobilisation">`:'').join('')}</div>
<button class="g" data-add="${id}">📷 Ajouter une photo</button></div>`).join('')||'<p>Aucun lycée trouvé. Demande l\'ajout du tien ci-dessous.</p>'}
$('#q').oninput=rs;
$('#list').onclick=e=>{const id=e.target.dataset.add;if(id){target=id;$('#f').click()}};
$('#f').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const d=await img(file);
db.ref(`schools/${target}/photos`).push(d)};

$('#rf').onsubmit=e=>{e.preventDefault();db.ref('requests').push({name:$('#rn').value.trim(),city:$('#rc').value.trim(),pseudo:$('#rp').value.trim()||'anonyme',ts:firebase.database.ServerValue.TIMESTAMP})
.then(()=>{$('#rok').textContent='Demande envoyée. Un admin va la consulter.';e.target.reset()}).catch(()=>$('#rok').textContent="Erreur : demande non envoyée.")};

</script></body></html>
